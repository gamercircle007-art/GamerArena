# Render Blueprint — GamerCircle production API
# Deploy: Dashboard → New → Blueprint → repo branch `sit`
# URL: https://gamer-circle-api.onrender.com
#
# SECRETS: set TWILIO_*, AWS_*, RAZORPAY_* in Dashboard (sync: false below).
# Never commit Auth Tokens or AWS keys into this file.

databases:
  - name: gamer-circle-db
    plan: free
    databaseName: gamer_circle
    user: gamer_circle
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: gamer-circle-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: gamer-circle-api
    runtime: python
    plan: free
    region: oregon
    branch: sit
    rootDir: backend
    # Build proves import. Default start = pure uvicorn so free-tier can leave Failed.
    # USE_FULL_BOOT=1 runs migrations/seed (scripts/render-start.sh) after Live is stable.
    buildCommand: pip install poetry==1.8.4 && poetry config virtualenvs.create false && poetry install --only main --no-root && python -c "from app.main import app; print('import_ok', app.title)"
    startCommand: bash -c 'if [ "${USE_FULL_BOOT:-0}" = "1" ]; then bash scripts/render-start.sh || exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}; else exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}; fi'
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # --- Production core ---
      - key: APP_ENV
        value: prod
      - key: APP_NAME
        value: gamer-circle
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: PYTHON_VERSION
        value: "3.12.8"
      # 0 = uvicorn only (recover Failed). Set 1 after Live for migrate+seed on boot.
      - key: USE_FULL_BOOT
        value: "0"
      - key: SEED_ON_BOOT
        value: "0"
      - key: SEED_TIMEOUT_SECONDS
        value: "30"
      - key: DB_WAIT_ATTEMPTS
        value: "4"
      - key: DB_WAIT_TIMEOUT_SEC
        value: "4"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUTH_METHODS
        value: "whatsapp_otp,password"
      - key: OTP_PROVIDER
        value: twilio
      # * = all browser origins (Angular admin + local). Credentials off when wildcard.
      # For tighter prod: set explicit origins in Dashboard (include http://localhost:4200).
      - key: CORS_ORIGINS
        value: "*"
      # * avoids TrustedHost rejecting internal health-check Host headers on free tier
      - key: ALLOWED_HOSTS
        value: "*"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_JSON
        value: "true"
      # SEED_ON_BOOT set above (0 for fast Live recovery)
      - key: DATABASE_URL
        fromDatabase:
          name: gamer-circle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gamer-circle-redis
          type: keyvalue
          property: connectionString

      # --- OTP: empty = real Twilio only (required for prod login) ---
      # If you still need fixed 123456 for testing, temporarily set APP_ENV=staging
      # and OTP_DEV_BYPASS_CODE=123456 in Dashboard (do not use in real launch).
      - key: OTP_DEV_BYPASS_CODE
        value: ""

      # --- Secrets: set real values in Render Dashboard → Environment ---
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_SMS_FROM
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_CLOUDFRONT_DOMAIN
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # Angular admin panel — free Static Site (CDN, no spin-down)
  # URL: https://gamer-circle-admin.onrender.com
  # Points at gamer-circle-api (environment.prod.ts)
  - type: web
    name: gamer-circle-admin
    runtime: static
    plan: free
    region: oregon
    branch: sit
    rootDir: admin-microservice-complete/frontend
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: ./dist/gameconnect-admin/browser
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
