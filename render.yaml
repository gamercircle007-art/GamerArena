# Render Blueprint — GameConnect / GamerCircle API
# Deploy: Dashboard → New → Blueprint → connect this repo (branch: sit)
# Docs: https://render.com/docs/infrastructure-as-code
#
# Creates:
#   1. PostgreSQL  (gamer-circle-db)
#   2. Redis/Key Value (gamer-circle-redis)
#   3. Web service (gamer-circle-api) → https://gamer-circle-api.onrender.com

databases:
  - name: gamer-circle-db
    plan: free
    databaseName: gamer_circle
    user: gamer_circle
    postgresMajorVersion: "16"
    # PostGIS: enabled at startup via CREATE EXTENSION (see scripts/render-start.sh)

services:
  - type: keyvalue
    name: gamer-circle-redis
    plan: free
    ipAllowList: []  # private — only other Render services
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: gamer-circle-api
    runtime: python
    plan: free
    region: oregon
    branch: sit
    rootDir: backend
    buildCommand: pip install poetry==1.8.4 && poetry config virtualenvs.create false && poetry install --only main --no-root
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OTP_DEV_BYPASS_CODE
        value: "123456"
      - key: AUTH_METHODS
        value: "whatsapp_otp,password"
      - key: CORS_ORIGINS
        value: "*"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gamer-circle-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gamer-circle-redis
          type: keyvalue
          property: connectionString
