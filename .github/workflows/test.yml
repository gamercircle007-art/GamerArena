# Lightweight test suite on sit/main.
# Full legacy Paythan matrix (playwright/lighthouse) is optional and non-blocking.

name: Tests

on:
  push:
    branches: [main, sit]
  pull_request:
    branches: [main, sit]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install poetry + deps
        run: |
          python -m pip install --upgrade pip
          pip install poetry==1.8.4
          poetry config virtualenvs.create false
          poetry install --no-interaction
      - name: Pytest
        env:
          JWT_SECRET_KEY: test_jwt_secret_key_for_ci_only_32chars
          APP_ENV: local
          DATABASE_URL: "sqlite+aiosqlite:///./dev.db"
          REDIS_URL: "redis://localhost:6379/1"
        run: poetry run pytest tests/ -q --tb=line

  flutter-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Pub get + unit tests
        working-directory: frontend/gamer_circle
        run: |
          flutter pub get
          flutter test
